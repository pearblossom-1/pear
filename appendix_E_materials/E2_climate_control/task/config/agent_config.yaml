id: gemini-3.1-pro-preview-lite
provider: openai
adapter: openai_compatible
model: gemini-3.1-pro-preview
env_file: .env
env_section: gpt
base_url_env: base_url
api_key_env: api_key
prompt_version: mdcbench_lite_v1
response_format: mdcbench_envelope_v1
supports_screenshots: true
supports_ui_elements: true
temperature: 0
request_timeout_s: 180
max_tokens: 8192
screenshot_context_mode: current_only
max_screenshots_per_prompt: auto
max_text_history_steps: 10
history_artifact_limit: 8000
current_observation_char_limit: 24000
text_history_char_limit: 24000
