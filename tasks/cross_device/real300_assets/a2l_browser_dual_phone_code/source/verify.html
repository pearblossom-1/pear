<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Account Verification</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 32px auto; padding: 20px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
    button { margin-top: 20px; padding: 10px 18px; }
  </style>
</head>
<body>
  <h1>Account Verification</h1>
  <form id="form" method="post" action="__MDCBENCH_FORM_ACTION__">
    <label>Account ID<input name="account_id" required></label>
    <label>One-time code<input name="code" required inputmode="numeric"></label>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
