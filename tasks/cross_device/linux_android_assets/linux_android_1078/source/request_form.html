<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Request approval form</title></head>
<body>
  <main>
    <h1>Request approval form</h1>
    <p>Submit only when the latest SMS supplies the required form code for the approved case.</p>
    <form method="post" action="__MDCBENCH_FORM_ACTION__">
      <label>Case ID <input name="case_id" required></label>
      <label>SMS form code <input name="sms_code" required></label>
      <button type="submit">Submit request</button>
    </form>
  </main>
</body>
</html>
