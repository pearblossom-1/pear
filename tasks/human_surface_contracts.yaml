schema_version: human_surface_contracts.v1
updated: '2026-08-24'
scope: core200_and_human_validation1000

confidence_levels:
  VERIFIED_RUNTIME: observed_in_current_screen_driven_session
  VERIFIED_EXISTING_REPORT: supported_by_existing_real_ui_report
  CODE_INFERRED: inferred_from_runtime_or_storage_code_not_ui_proof
  NOT_VERIFIED: not_established_by_current_real_ui_evidence

device_addressing:
  one_android:
    preferred: the phone
    internal_device: android_0
  two_android:
    preferred:
      android_0: the first phone
      android_1: the second phone
  one_linux:
    preferred: the Linux machine
    internal_device: linux_0
  two_linux:
    preferred:
      linux_0: the first Linux machine
      linux_1: the second Linux machine
  rules:
    - same_absolute_path_on_two_android_devices_is_not_the_same_file
    - same_absolute_path_on_two_linux_devices_is_not_the_same_file
    - multi_device_absolute_paths_must_be_device_scoped
    - localhost_and_file_urls_are_local_to_the_browser_vm

transfer_semantics:
  cognitive_fact_transfer:
    allowed: true
    description: read_visible_facts_on_one_device_and_manually_enter_them_on_another
  matrix:
    android_to_android:
      text_facts: true
      copied_text_manually: true
      file_binary_transfer: 'NO'
      verified_user_facing_channel: null
      confidence: VERIFIED_EXISTING_REPORT
    android_to_linux:
      text_facts: true
      copied_text_manually: true
      file_binary_transfer: 'NO'
      verified_user_facing_channel: null
      notes:
        - setup_provided_linux_local_counterpart_is_not_participant_transfer
      confidence: VERIFIED_EXISTING_REPORT
    linux_to_android:
      text_facts: true
      copied_text_manually: true
      file_binary_transfer: 'NO'
      verified_user_facing_channel: null
      confidence: VERIFIED_EXISTING_REPORT
    linux_to_linux:
      text_facts: true
      copied_text_manually: true
      file_binary_transfer: CONDITIONAL
      verified_user_facing_channel: temporary_http_server_and_visible_download
      evidence:
        - docs/linux_surface_real_ui_audit/test_matrix.md#B08
        - docs/linux_surface_real_ui_audit/test_matrix.md#G01
      confidence: VERIFIED_EXISTING_REPORT

path_roots:
  android.public_storage:
    instruction_path_policy: user_visible_if_device_scoped
    preferred_style: visible_directory_and_filename
  android.android_data:
    instruction_path_policy: backend_only
  android.private_data:
    instruction_path_policy: backend_only
  linux.tmp:
    instruction_path_policy: user_visible_if_device_scoped
    limitations:
      - snap_chromium_cannot_access_host_tmp_local_files
    confidence: VERIFIED_EXISTING_REPORT
  linux.home_user:
    instruction_path_policy: user_visible_if_device_scoped
    confidence: VERIFIED_EXISTING_REPORT
  linux.home_oai:
    instruction_path_policy: not_default_until_task_specific_runtime_verification
    evidence:
      - docs/android_surface_real_ui_audit/human_validation1000_real_operation_report.md#H02
    confidence: VERIFIED_EXISTING_REPORT

surfaces:
  android.files:
    device_family: android
    user_facing_object: file_or_folder
    backend_locator_examples:
      - /storage/emulated/0/Download/<filename>
      - /data/media/0/Download/<filename>
    instruction_path_policy: user_visible_if_device_scoped
    preferred_reference:
      source: '"<filename>" in <visible folder> on <phone>'
      output: 'save or move "<filename>" to <visible folder> on <phone>'
    extension_behavior:
      visible_in_list: true
      user_enters_extension: depends_on_creator_app
    runtime_verified: true
    confidence: VERIFIED_EXISTING_REPORT
    evidence:
      - docs/android_surface_real_ui_audit/real_operation_report.md#A10
      - docs/android_surface_real_ui_audit/human_validation1000_real_operation_report.md#H01
    limitations:
      - physical_upload_may_need_indexing_before_files_ui_visibility
      - media_type_label_may_not_equal_real_codec
      - pdf_docx_xlsx_zip_default_viewers_not_verified

  android.markor:
    device_family: android
    user_facing_object: note
    backend_locator_examples:
      - /storage/emulated/0/Documents/Markor/<name>.md
    instruction_path_policy: backend_only
    preferred_reference:
      source: 'the "<title>" note in Markor on <phone>'
      output: 'create a note called "<title>" in Markor on <phone>'
    extension_behavior:
      visible_in_list: true
      visible_in_editor_title: false
      user_enters_extension: not_verified
    runtime_verified: true
    confidence: VERIFIED_EXISTING_REPORT
    evidence:
      - runs/linux_surface_real_ui_audit/B08_a2l2_vscode_android0_markor_attempt2/screenshots/step_003.png
      - runs/linux_surface_real_ui_audit/B08_a2l2_vscode_android0_markor_attempt2/screenshots/step_006.png
      - docs/android_surface_real_ui_audit/real_operation_report.md#A15
    limitations:
      - uploaded_note_may_require_visible_refresh
      - same_named_nested_markor_folder_can_cause_wrong_output_path

