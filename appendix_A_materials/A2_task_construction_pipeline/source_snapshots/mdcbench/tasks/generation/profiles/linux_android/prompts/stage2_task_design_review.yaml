  - name: "Compression diagnostic: multi-source conflict keeps source-of-truth in source"
    sample: |
      android_0 surface: android.calendar_event
      android_1 surface: android.contacts
      linux_0 surface: linux.csv
      linux_1 surface: linux.json
    task_design: |
      visible_sources:
        - source_id: calendar_visit
          device_id: android_0
          surface: android.calendar_event
          visible_name_or_path: Simple Calendar Pro event `Vendor visit`
          content: "title=Vendor visit; vendor=Aster Supply; visit_time=2027-02-26 12:00; location=Dock 2"
        - source_id: contact_vendor
          device_id: android_1
          surface: android.contacts
          visible_name_or_path: Android Contacts entry `Aster Supply`
          content: "name=Aster Supply; phone=555-0188; note=Current phone verified in Contacts"
        - source_id: ledger_csv
          device_id: linux_0
          surface: linux.csv
          visible_name_or_path: /home/user/vendor/ledger.csv
          content: |
            vendor,phone,visit_time,source_of_truth
            Aster Supply,555-0144,2027-02-26 10:00,calendar_time_contacts_phone
      required_outputs:
        - output_id: sync_report
          device_id: linux_1
          surface: linux.json
          visible_name_or_path: /home/user/vendor/sync_report.json
      original_instruction: |
        Compare the Simple Calendar Pro Vendor visit event on android_0, the Android Contacts entry Aster Supply on android_1,
        and /home/user/vendor/ledger.csv on linux_0. Use the calendar visit_time as truth for visit_time and the contact phone
        as truth for phone, then create /home/user/vendor/sync_report.json on linux_1 with vendor, phone, visit_time, source_of_truth,
        and mismatch fields.
      bad_optimized_instruction: |
        Compare the event, contact, and CSV, use calendar_time_contacts_phone as the source of truth, set phone to 555-0188,
        visit_time to 2027-02-26 12:00, and write vendor, phone, visit_time, source_of_truth, and mismatch to the JSON report.
      compression_analysis: |
        三个 source 已经可见地提供 vendor、冲突值和 source_of_truth 规则。instruction 必须保留三个 source 入口和目标 JSON 路径，
        但不要重复最终 phone/time、字段清单或规则字符串。
    response: |
      {
        "decision": "accepted",
        "optimized_instruction": "Compare the Simple Calendar Pro `Vendor visit` event on the first Android device, the Android Contacts entry for Aster Supply on the second Android device, and `/home/user/vendor/ledger.csv` on the first Linux device. Follow their source-of-truth rule and create `/home/user/vendor/sync_report.json` on the second Linux device.",
