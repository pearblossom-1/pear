schema_version: surface_capabilities.v1
catalog_scope: linux_android_generation
purpose:
  - "Constrain task generation to surfaces that MDCBench can set up and evaluate today."
  - "Describe stable source/output shapes, runtime setup actions, evaluator getters, and known unsupported designs."

runtime_interfaces:
  android:
    setup_actions:
      - wait
      - adb_shell
      - upload_file
      - ensure_app
      - open_app
      - androidworld_sms_clear
      - androidworld_sms_receive
      - androidworld_sms_send
      - androidworld_contacts_clear
      - androidworld_contact_add
      - androidworld_calendar_clear
      - androidworld_calendar_event_add
      - androidworld_clock_clear
      - androidworld_alarm_add
      - androidworld_timer_add
      - androidworld_recipes_clear
      - androidworld_recipe_add
      - androidworld_tasks_clear
      - androidworld_task_add
      - androidworld_media_clear
      - androidworld_mp3_push
      - androidworld_retro_music_clear
      - androidworld_retro_playlist_add
      - androidworld_osmand_favorites_setup
    getters:
      - rule
      - adb_shell
      - android_sms_message
      - androidworld_sms_message
      - androidworld_contact
      - androidworld_calendar_event
      - androidworld_timer
      - androidworld_alarm
      - androidworld_recipe
      - androidworld_task
      - android_file_state
      - android_file_count
      - android_file_size_state
      - retro_music_playlist
      - retro_music_playing_queue
      - osmand_favorite
      - osmand_marker
      - android_setting
      - ui_text
    evaluator_funcs:
      - exact_match
      - contains
    notes:
      - "Android native scoring uses exact_match or contains over getter output."
      - "Use adb_shell for Markor/file/text checks when no app-specific getter exists."
      - "Media inserted by upload_file should be followed by a MediaScanner broadcast when an app UI must see it."
  linux:
    setup_actions:
      - upload_file
      - execute
      - command
    agent_actions:
      - cli.execute
      - gui.pyautogui
      - gui.computer_13
    getters:
      - local_file
      - rule
      - vm_command_line
      - vm_file
      - open_tabs_info
      - bookmarks
      - thunderbird_drafts
      - vlc_playing_file
    evaluator_funcs:
      - exact_match
      - contains
      - check_include_exclude
      - check_csv
      - check_json
      - check_xlsx_cells
      - check_image_dimensions
      - check_odf_text
      - check_docx_text
      - compare_archive
      - compare_pdf_images
      - compare_pdfs
      - is_expected_bookmarks
      - is_expected_tabs
      - bookmark_folder_urls
      - check_python_file_by_test_suite
      - compare_docx_files
      - compare_docx_tables
      - compare_image_text
    notes:
      - "vm_file prechecks missing files and returns a failing value instead of retrying indefinitely."
      - "vm_command_line runs string commands with shell=True by default."
      - "Internal web pages should be file URLs or localhost pages whose submit behavior is deterministic."

runtime_interface_details:
  setup_actions:
    ensure_app:
      device_family: android
      purpose: "Ensure an Android app is installed/initialized; use before app-specific setup when the app must be visible."
      parameters:
        app: "Required unless app_name is used. Must be one of the runtime-supported app names."
        app_name: "Alias for app."
      example:
        type: ensure_app
        parameters:
          app: simple sms messenger
    open_app:
      device_family: android
      purpose: "Open an Android app after setup when the initial UI matters."
      parameters:
        app: "Required unless app_name is used. Must be one of the runtime-supported app names."
        app_name: "Alias for app."
      example:
        type: open_app
        parameters:
          app: markor
    wait:
      device_family: android
      purpose: "Wait for app/provider state to settle."
      parameters:
        seconds: "Optional numeric wait duration."
      example:
        type: wait
        parameters:
          seconds: 1.0
    adb_shell:
      device_family: android
      purpose: "Run Android shell; use for Markor file writes, MediaScanner broadcasts, cleanup, or file text checks."
      parameters:
        command: "Required string or argv list. Prefer ['sh','-c','...'] for quoting and multi-command scripts."
      example:
        type: adb_shell
        parameters:
          command:
            - sh
            - -c
            - "mkdir -p /storage/emulated/0/Documents/Markor && cat > '/storage/emulated/0/Documents/Markor/request.md' <<'EOF'\nbody\nEOF"
    upload_file:
      device_family: linux_android
      purpose: "Upload files produced by Stage4 external_files; do not invent local_path values."
      parameters:
        files: "Required non-empty array of {local_path, path}; local_path must match Stage4 external_files.relative_path or materializer-derived file."
      example:
        type: upload_file
        parameters:
          files:
            - local_path: source/form.html
              path: /home/user/forms/form.html
    androidworld_sms_clear:
      device_family: android
      app: "Simple SMS Messenger"
      purpose: "Clear SMS inbox/sent/thread state; use at setup start and cleanup for SMS tasks."
      parameters: {}
      example:
        type: androidworld_sms_clear
        parameters: {}
    androidworld_sms_receive:
      device_family: android
      app: "Simple SMS Messenger"
      purpose: "Inject an incoming SMS source into inbox."
      parameters:
        address: "Required unless phone_number is used. Sender phone number."
        phone_number: "Alias for address."
        body: "Required unless message is used. SMS body visible to the agent."
        message: "Alias for body."
        wait_s: "Optional numeric settle wait; default 5.0."
      example:
        type: androidworld_sms_receive
        parameters:
          address: "+15550101"
          body: "Use report.pdf and create the note."
          wait_s: 5.0
    androidworld_sms_send:
      device_family: android
      app: "Simple SMS Messenger"
      purpose: "Create/send a sent SMS state; mainly for positive oracle or source sent-history tasks, not ordinary setup for an output goal."
      parameters:
        address: "Required unless phone_number is used. Recipient phone number."
        phone_number: "Alias for address."
        body: "Required unless message is used. Sent SMS body."
        message: "Alias for body."
      example:
        type: androidworld_sms_send
        parameters:
          address: "+15550101"
          body: "Saved Broccoli Stir-Fry for 4 servings."
    androidworld_contacts_clear:
      device_family: android
      app: "Android Contacts"
      purpose: "Clear Contacts app data."
      parameters: {}
      example:
        type: androidworld_contacts_clear
        parameters: {}
    androidworld_contact_add:
      device_family: android
      app: "Android Contacts"
      purpose: "Insert a contact source or oracle contact output."
      parameters:
        name: "Required display name."
        number: "Required phone number."
        notes: "Optional note text; use notes when evaluator needs notes_contains."
        email: "Optional, but current native getter does not validate email directly."
      example:
        type: androidworld_contact_add
        parameters:
          name: Aster Supply
          number: "+15550123"
          notes: Dock 2
    androidworld_calendar_clear:
      device_family: android
      app: "Simple Calendar Pro"
      purpose: "Clear calendar events."
      parameters: {}
      example:
        type: androidworld_calendar_clear
        parameters: {}
    androidworld_calendar_event_add:
      device_family: android
      app: "Simple Calendar Pro"
      purpose: "Insert a calendar event source or oracle output."
      parameters:
        title: "Required."
        start_ts: "Required epoch milliseconds integer; do not use ISO strings or 10-digit seconds."
        end_ts: "Required epoch milliseconds integer."
        location: "Optional string."
        description: "Optional string."
        reminder_1_minutes: "Optional integer reminder."
        reminder_2_minutes: "Optional integer reminder."
        reminder_3_minutes: "Optional integer reminder."
        repeat_interval: "Optional integer when explicit recurrence is supported by task."
        repeat_rule: "Optional integer when explicit recurrence is supported by task."
      example:
        type: androidworld_calendar_event_add
        parameters:
          title: Gate audit
          start_ts: 1801911600000
          end_ts: 1801913400000
          location: Gate C
          description: "Appointment: Gate audit on 2027-02-06 from 11:00 to 11:30 at Gate C."
    androidworld_clock_clear:
      device_family: android
      app: "Clock"
      purpose: "Clear Clock app data for alarms/timers."
      parameters: {}
      example:
        type: androidworld_clock_clear
        parameters: {}
    androidworld_alarm_add:
      device_family: android
      app: "Clock"
      purpose: "Create an alarm with hour/minute and optional label."
      parameters:
        hour: "Required integer 0-23."
        minute: "Required integer 0-59."
        label: "Optional string; evaluator can match it."
      unsupported_parameters:
        - date
        - weekdays
        - repeat_days
      example:
        type: androidworld_alarm_add
        parameters:
          hour: 7
          minute: 30
          label: Pickup
    androidworld_timer_add:
      device_family: android
      app: "Clock"
      purpose: "Create a timer duration."
      parameters:
        hours: "Required integer."
        minutes: "Required integer."
        seconds: "Required integer."
      unsupported_parameters:
        - label
        - future_schedule
      example:
        type: androidworld_timer_add
        parameters:
          hours: 0
          minutes: 18
          seconds: 30
    androidworld_recipes_clear:
      device_family: android
      app: "Broccoli app"
      purpose: "Clear Broccoli recipe rows."
      parameters: {}
      example:
        type: androidworld_recipes_clear
        parameters: {}
    androidworld_recipe_add:
      device_family: android
      app: "Broccoli app"
      purpose: "Insert a Broccoli recipe row."
      parameters:
        title: "Required."
        description: "Optional string."
        servings: "Optional string."
        preparationTime: "Optional string."
        source: "Optional string."
        ingredients: "Optional string; use a deterministic separator such as semicolon."
        directions: "Optional string."
        favorite: "Optional integer 0/1."
      example:
        type: androidworld_recipe_add
        parameters:
          title: Broccoli Stir-Fry
          description: Quick weeknight side with garlic and soy.
          servings: "2"
          preparationTime: 10 mins
          source: Family Cookbook
          ingredients: "broccoli; garlic; soy sauce; oil; salt"
          directions: "Heat oil, add garlic, add broccoli, stir-fry 5-7 min, add soy sauce."
          favorite: 0
    androidworld_tasks_clear:
      device_family: android
      app: "Tasks"
      purpose: "Clear Tasks app rows."
      parameters: {}
      example:
        type: androidworld_tasks_clear
        parameters: {}
    androidworld_task_add:
      device_family: android
      app: "Tasks"
      purpose: "Insert a task source or oracle task output."
      parameters:
        title: "Required."
        notes: "Optional string."
        dueDate: "Optional epoch milliseconds integer or 0."
        hideUntil: "Optional epoch milliseconds integer or 0."
        completed: "Optional bool/int."
        importance: "Optional integer."
        created: "Optional epoch milliseconds integer or 0."
        modified: "Optional epoch milliseconds integer or 0."
      example:
        type: androidworld_task_add
        parameters:
          title: Client check-in
          notes: Lobby A 12:00
          dueDate: 1803211200000
          completed: 0
    androidworld_media_clear:
      device_family: android
      app: "Android media directories"
      purpose: "Clear one supported Android media directory."
      parameters:
        kind: "Required; one of photos, videos, audio_recorder, gallery, download."
      example:
        type: androidworld_media_clear
        parameters:
          kind: photos
    androidworld_mp3_push:
      device_family: android
      app: "Retro Music"
      purpose: "Generate/push MP3 fixtures for Retro Music."
      parameters:
        songs: "Required non-empty array of song titles."
      example:
        type: androidworld_mp3_push
        parameters:
          songs:
            - Focus One
            - Focus Two
    androidworld_retro_music_clear:
      device_family: android
      app: "Retro Music"
      purpose: "Clear Retro Music state."
      parameters: {}
      example:
        type: androidworld_retro_music_clear
        parameters: {}
    androidworld_retro_playlist_add:
      device_family: android
      app: "Retro Music"
      purpose: "Create a named Retro Music playlist from pushed songs."
      parameters:
        playlist_name: "Required."
        songs: "Required non-empty array of song titles."
      example:
        type: androidworld_retro_playlist_add
        parameters:
          playlist_name: Focus
          songs:
            - Focus One
            - Focus Two
    androidworld_osmand_favorites_setup:
      device_family: android
      app: "OsmAnd"
      purpose: "Prepare OsmAnd favorites storage; actual favorite source normally uses a generated GPX uploaded to the verified OsmAnd favorites path."
      parameters: {}
      example:
        type: androidworld_osmand_favorites_setup
        parameters: {}
    execute:
      device_family: linux
      purpose: "Run a Linux command in the VM; use for mkdir/rm, writing inline files, starting local helpers, Chrome, VLC, or cleanup."
      parameters:
        command: "Required string command."
        shell: "Optional bool; use true for shell syntax such as &&, pipes, heredocs, redirects."
      example:
        type: execute
        parameters:
          command: "mkdir -p /home/user/forms && rm -f /home/user/forms/result.json"
          shell: true
  getters:
    rule:
      device_family: linux_android
      purpose: "Expected-value holder, not a state getter. Use under expected.type=rule."
    adb_shell:
      device_family: android
      purpose: "Run Android shell and return stdout text."
      parameters:
        command: "Required string or argv list."
      example_result:
        type: adb_shell
        command: "cat /storage/emulated/0/Documents/Markor/result.md 2>/dev/null || echo missing"
    androidworld_sms_message:
      device_family: android
      app: "Simple SMS Messenger"
      aliases:
        - android_sms_message
      purpose: "Query Android SMS provider and return present/missing for a matching SMS."
      returns:
        - present
        - missing
      parameters:
        box: "Optional: sent, inbox, all. Default all."
        address: "Required; phone number, normalized by removing spaces and hyphens."
        body: "Exact body string; use body or body_contains."
        body_contains: "String or array of required body substrings; use when punctuation/wording can vary."
        recent_within_mins: "Optional; sent defaults to 5, inbox/all default to 0. Use 0 to disable recency window."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_sms_message
          box: sent
          address: "+15550101"
          body_contains:
            - Broccoli Stir-Fry
            - 4 servings
          recent_within_mins: 5
        expected:
          type: rule
          rules:
            expected: present
    androidworld_contact:
      device_family: android
      app: "Android Contacts"
      purpose: "Return present/missing for a contact with exact name/number and optional note anchor."
      returns:
        - present
        - missing
      parameters:
        name: "Required exact display name."
        number: "Required phone number; cleaned by AndroidWorld contacts utils."
        notes_contains: "Optional required substring in contact note."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_contact
          name: Aster Supply
          number: "+15550123"
          notes_contains: Dock 2
        expected:
          type: rule
          rules:
            expected: present
    androidworld_calendar_event:
      device_family: android
      app: "Simple Calendar Pro"
      purpose: "Return present/missing for an event matching supplied fields."
      returns:
        - present
        - missing
      parameters:
        title: "Required exact title."
        start_ts: "Optional epoch milliseconds integer."
        end_ts: "Optional epoch milliseconds integer."
        location: "Optional exact string."
        description: "Optional exact string."
        reminder_1_minutes: "Optional integer."
        reminder_2_minutes: "Optional integer."
        reminder_3_minutes: "Optional integer."
        repeat_interval: "Optional integer."
        repeat_rule: "Optional integer."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_calendar_event
          title: Gate audit
          start_ts: 1801911600000
          end_ts: 1801913400000
          location: Gate C
        expected:
          type: rule
          rules:
            expected: present
    androidworld_task:
      device_family: android
      app: "Tasks"
      purpose: "Return present/missing for a task matching supplied fields."
      returns:
        - present
        - missing
      parameters:
        title: "Required exact title."
        notes: "Optional exact notes."
        notes_contains: "Optional notes substring."
        dueDate: "Optional epoch milliseconds integer or 0."
        completed: "Optional bool."
        importance: "Optional integer."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_task
          title: Client check-in
          notes_contains: Lobby A
          dueDate: 1803211200000
        expected:
          type: rule
          rules:
            expected: present
    androidworld_alarm:
      device_family: android
      app: "Clock"
      purpose: "Return present/missing for an alarm by hour/minute and optional label/enabled."
      returns:
        - present
        - missing
      parameters:
        hour: "Required integer 0-23."
        minute: "Required integer 0-59."
        label: "Optional substring/fuzzy UI/provider label match."
        enabled: "Optional bool."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_alarm
          hour: 7
          minute: 30
          label: Pickup
        expected:
          type: rule
          rules:
            expected: present
    androidworld_timer:
      device_family: android
      app: "Clock"
      purpose: "Return present/missing for a timer duration; label is not supported."
      returns:
        - present
        - missing
      parameters:
        hours: "Required integer."
        minutes: "Required integer."
        seconds: "Required integer."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_timer
          hours: 0
          minutes: 18
          seconds: 30
        expected:
          type: rule
          rules:
            expected: present
    androidworld_recipe:
      device_family: android
      app: "Broccoli app"
      purpose: "Return present/missing for a recipe row matching supplied fields."
      returns:
        - present
        - missing
      parameters:
        title: "Required exact title."
        description: "Optional exact string."
        servings: "Optional exact string."
        preparationTime: "Optional exact string."
        source: "Optional exact string."
        ingredients: "Optional exact string; arrays are invalid."
        directions: "Optional exact string."
        favorite: "Optional 0 or 1."
      example_evaluator:
        device_id: android_0
        func: exact_match
        result:
          type: androidworld_recipe
          title: Broccoli Stir-Fry
          servings: "4"
          preparationTime: 20 mins
          favorite: 1
        expected:
          type: rule
          rules:
            expected: present
    android_file_state:
      device_family: android
      purpose: "Return present/missing for file existence at path."
      returns:
        - present
        - missing
      parameters:
        path: "Required Android path."
    android_file_size_state:
      device_family: android
      purpose: "Return nonempty/empty/missing for file at path."
      returns:
        - nonempty
        - empty
        - missing
      parameters:
        path: "Required Android path."
    android_file_count:
      device_family: android
      purpose: "Return count of files directly under path."
      parameters:
        path: "Required Android directory path."
    retro_music_playlist:
      device_family: android
      app: "Retro Music"
      purpose: "Return present/missing for a playlist name and optional fuzzy song title list."
      returns:
        - present
        - missing
      parameters:
        playlist_name: "Required playlist name."
        expected_songs: "Optional array of expected song titles."
    retro_music_playing_queue:
      device_family: android
      app: "Retro Music"
      purpose: "Return JSON string like {\"songs\":[...]} for current queue; use only as auxiliary evidence."
    osmand_favorite:
      device_family: android
      app: "OsmAnd"
      purpose: "Return present/missing for a favorite. If favorite_name and favorite_lat/favorite_lon are both supplied, the same waypoint must match both the fuzzy name and coordinates within 0.001 degrees; name-only or coordinate-only checks are allowed when only one condition is supplied."
      returns:
        - present
        - missing
      parameters:
        favorite_name: "Optional favorite name."
        favorite_lat: "Optional latitude."
        favorite_lon: "Optional longitude."
    osmand_marker:
      device_family: android
      app: "OsmAnd"
      purpose: "Return JSON string with markers and target_found for coordinates."
      parameters:
        marker_lat: "Optional latitude."
        marker_lon: "Optional longitude."
    android_setting:
      device_family: android
      purpose: "Return Android settings get output."
      parameters:
        namespace: "Optional: global, secure, system. Default system."
        name: "Required setting name."
    ui_text:
      device_family: android
      purpose: "Return current Android UI text from accessibility state; use cautiously for stable text only."
    vm_command_line:
      device_family: linux
      purpose: "Run Linux command and return stdout text."
      parameters:
        command: "Required string command."
        shell: "Optional bool; true for shell syntax."
    vm_file:
      device_family: linux
      purpose: "Fetch a Linux file for structured metrics; do not use directly with exact_match/contains."
      parameters:
        path: "Required Linux file path."
    local_file:
      device_family: linux
      purpose: "Use a local gold/reference file as expected artifact."
      parameters:
        path: "Required local repository path."
    open_tabs_info:
      device_family: linux
      purpose: "Return Chrome tab info for tab URL/title metrics."
      parameters:
        ignore_default_tabs: "Optional bool; use true to ignore blank/default tabs."
    bookmarks:
      device_family: linux
      purpose: "Return Chrome bookmark state for bookmark metrics."
    thunderbird_drafts:
      device_family: linux
      purpose: "Return Thunderbird draft text for contains/check_include_exclude."
    vlc_playing_file:
      device_family: linux
      purpose: "Return true/false for current VLC playback file."
      parameters:
        expected_file: "Required expected file path or filename."
  evaluator_funcs:
    exact_match:
      purpose: "Score 1 when str(actual) == str(expected)."
      expected_shape:
        type: rule
        rules:
          expected: present
    contains:
      purpose: "Score 1 when expected string is a substring of actual string."
      expected_shape:
        type: rule
        rules:
          expected: "anchor text"
    check_include_exclude:
      purpose: "Check include/exclude anchors against text returned by vm_command_line or thunderbird_drafts."
      expected_shape:
        type: rule
        rules:
          include:
            - INC-42
          exclude:
            - draft
    check_csv:
      purpose: "Read CSV via vm_file and check expected rows/fields."
      expected_shape:
        type: rule
        rules:
          expect:
            - id: R-104
              status: approved
    check_json:
      purpose: "Read JSON via vm_file and check task-specific key/value structure."
    check_xlsx_cells:
      purpose: "Read .xlsx via vm_file and check exact cells; supports single-sheet rules.cells or multi-sheet rules.sheets[].cells; not for .ods."
    check_odf_text:
      purpose: "Read .odt/.odp/.ods via vm_file and check text anchors."
    check_docx_text:
      purpose: "Read .docx via vm_file and check text anchors."
    check_image_dimensions:
      purpose: "Check image dimensions via vm_file. Supported rules keys: count, filenames, exact_size, all_square, same_size, min_width, min_height, max_width, max_height. Do not use expected, width, or height keys."
    compare_image_text:
      purpose: "OCR image via vm_file and match rules.type=text + rules.text; only use when text is large/high contrast and OCR is available."
    compare_archive:
      purpose: "Compare ZIP/archive via vm_file against gold; for simple file names prefer unzip -l through vm_command_line."
    compare_pdf_images:
      purpose: "Compare rendered PDF pages against gold images."
    compare_pdfs:
      purpose: "Compare PDFs against gold when rendering/content is stable."
    is_expected_tabs:
      purpose: "Check open_tabs_info against expected URLs/titles."
    is_expected_bookmarks:
      purpose: "Check bookmarks against expected bookmark state."
    bookmark_folder_urls:
      purpose: "Check URLs under a bookmark folder."
    check_python_file_by_test_suite:
      purpose: "Run/check a Python project file against a local test suite."
    compare_docx_files:
      purpose: "Compare DOCX document content against gold."
    compare_docx_tables:
      purpose: "Compare DOCX table content against expected/gold."

surfaces:
  android.markor_note:
    device_family: android
    display_name: "Android Markor note"
    stable_sources:
      - "A markdown/text note stored under external storage, usually /sdcard/Documents or another explicit path."
      - "A short visible request, rule, checklist, or structured text that the agent can read in Markor."
    stable_outputs:
      - "A markdown/text note with deterministic title/path and required text anchors."
      - "A note used as an audit log or status report."
    setup_interfaces:
      - ensure_app:markor
      - adb_shell
      - upload_file
    evaluation_interfaces:
      - adb_shell
      - android_file_state
      - android_file_size_state
      - exact_match
      - contains
    supported_goal_checks:
      - "File exists at expected note path."
      - "File content contains required anchors and excludes forbidden anchors."
    unsupported_designs:
      - "Do not require checking Markor formatting beyond raw text anchors."
      - "Do not rely on a native Markor database getter; none exists."
    generation_rules:
      - "Use a natural note title or explicit path, never the surface id."
      - "If the note contains detailed field requirements, keep the user instruction concise and refer to the note."

  android.files_download:
    device_family: android
    display_name: "Android Files / Download"
